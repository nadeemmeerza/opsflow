services:
  # ==========================================================
  # MongoDB
  # ==========================================================
  mongodb:
    image: mongo:8
    container_name: opsflow-mongodb-prod
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongodb_prod_data:/data/db

    networks:
      - opsflow-prod

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: opsflow-redis-prod
    restart: unless-stopped

    networks:
      - opsflow-prod

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # NestJS API
  # ==========================================================
  api:
    image: opsflow-api:local
    container_name: opsflow-api-prod
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PROJECT_TTL_SECONDS: ${REDIS_PROJECT_TTL_SECONDS}

      CORS_ORIGIN: ${CORS_ORIGIN}

    ports:
      - "3000:3000"

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - opsflow-prod

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ==========================================================
  # Next.js Web
  # ==========================================================
  web:
    image: opsflow-web:local
    container_name: opsflow-web-prod
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0

      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "3001:3001"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - opsflow-prod


# ============================================================
# Persistent storage
# ============================================================

volumes:
  mongodb_prod_data:


# ============================================================
# Private application network
# ============================================================

networks:
  opsflow-prod:
    driver: bridge